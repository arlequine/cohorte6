name: Validar material

# Verifica que los proyectos de ejemplo del programa compilen, pasen sus tests y que el Terraform sea válido.
# No despliega nada ni usa credenciales.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    name: node · ${{ matrix.proyecto }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        proyecto:
          - plantilla-alumno
          - estacion3/repos/walking-skeleton
          - estacion9/repos/producto-desplegado
          - estacion10/repos/producto-seguro
          - estacion8/repos/entrevista-qa
          - estacion11/repos/entrevista-obs
    defaults:
      run:
        working-directory: ${{ matrix.proyecto }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run verify
      - run: bash scripts/sync-skills.sh --check
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  terraform:
    name: terraform · ${{ matrix.carpeta }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        carpeta:
          - estacion9/repos/producto-desplegado/infra
          - estacion9/repos/producto-desplegado/infra/bootstrap
          - estacion10/repos/producto-seguro/infra
          - estacion10/repos/producto-seguro/infra/bootstrap
    defaults:
      run:
        working-directory: ${{ matrix.carpeta }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Versiones de providers resueltas
        run: terraform providers lock -platform=linux_amd64 >/dev/null 2>&1; cat .terraform.lock.hcl | grep -E '^provider|version ' || true

  semgrep:
    name: semgrep · estacion10/repos/producto-seguro
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v5
      - name: La solución de referencia de E10 no debe tener hallazgos
        working-directory: estacion10/repos/producto-seguro
        run: semgrep scan --config p/default --config p/terraform --error --metrics=off

  scripts:
    name: rúbricas y scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Las rúbricas en JSON coinciden con las guías
        run: node scripts/generar-rubricas.mjs --check
      - name: Tests de los scripts
        run: node --test scripts/*.test.mjs

  k6:
    name: k6 · estacion11/repos/entrevista-obs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estacion11/repos/entrevista-obs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Levantar la app con el motor simulado
        run: |
          npm run start > app.log 2>&1 &
          for i in $(seq 60); do curl -sf http://localhost:3000/api/health > /dev/null && exit 0; sleep 1; done
          cat app.log; exit 1
        env:
          AGENT_MODE: simulado
          SIMULADO_LATENCIA_MS: "200"
      - uses: grafana/setup-k6-action@v1
      - name: Perfil de humo con los umbrales del script
        run: k6 run -e PAUSA_S=0.2 carga/entrevista.js

  hr-ia:
    name: node · estacion11/repos/requirement-hr-ia (Cohorte 4, track avanzado)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estacion11/repos/requirement-hr-ia/webapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx vitest run
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  playwright:
    name: playwright · estacion8/repos/entrevista-qa
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: estacion8/repos/entrevista-qa
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E, BDD y API contra el motor de reglas
        run: npm run test:playwright
        env:
          NEXT_TELEMETRY_DISABLED: "1"
